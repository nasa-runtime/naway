syntax = "proto3";
package naway.management.v1;

// 节点身份来自 mTLS，消息中的身份必须与接收端配置的证书绑定一致。
service NodeManagement {
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc AuthenticateIssuer(IssuerChallenge) returns (IssuerProof);
  rpc Report(ReportRequest) returns (ReportResponse);
  rpc Catalog(CatalogRequest) returns (CatalogResponse);
  rpc Consumers(ConsumersRequest) returns (CatalogResponse);
  rpc Certificates(CertificatesRequest) returns (CatalogResponse);
  rpc Sample(stream SampleRequest) returns (SampleResponse);
  rpc ActionData(ActionDataRequest) returns (ActionDataResponse);
  rpc ActionResult(ActionResultRequest) returns (ActionResultResponse);
  rpc ReleaseResult(ReleaseResultRequest) returns (ReleaseResultResponse);
  rpc PreviewData(PreviewDataRequest) returns (PreviewDataResponse);
  rpc PreviewResult(PreviewResultRequest) returns (PreviewResultResponse);
  rpc MaterialConditionsResult(MaterialConditionsResultRequest) returns (MaterialConditionsResultResponse);
  rpc MaterialPreviewData(MaterialPreviewDataRequest) returns (MaterialPreviewDataResponse);
  rpc MaterialPreviewResult(MaterialPreviewResultRequest) returns (MaterialPreviewResultResponse);
}

message OpenRequest {
  string node_id = 1;
  string boot_id = 2;
}

message OpenResponse {
  bytes session = 1;
}

// 每次握手独立挑战；证明仅确认当前接收端身份，不授予任何节点动作权限。
message IssuerChallenge {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  bytes challenge = 4;
}

message IssuerProof {
  uint32 schema = 1;
  string cluster_id = 2;
  string issuer_node_id = 3;
  string signature = 4;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_ADMIN = 1;
  MODE_DATA = 2;
  MODE_ALL_IN_ONE = 3;
  MODE_SIDECAR = 4;
}

// 当前状态不携带请求、日志、秘密或配置正文；数量表示配置计划。
message NodeFacts {
  string node_id = 1;
  string boot_id = 2;
  Mode mode = 3;
  bool ready = 4;
  uint64 config_version = 5;
  optional uint64 config_fingerprint = 6;
  bool discovery_enabled = 7;
  bool configuration_enabled = 8;
  uint32 proxies = 9;
  uint32 routes = 10;
  uint32 services = 11;
}

message ReportRequest {
  bytes session = 1;
  uint64 sequence = 2;
  NodeFacts facts = 3;
  bool metrics_supported = 4;
  bool metrics_enabled = 5;
  bool baseline_supported = 6;
  NodeBaseline node_baseline = 7;
  PublicationObservation local_publication = 8;
  bool actions_supported = 9;
  bool actions_enabled = 10;
  bool previews_supported = 11;
  bool previews_enabled = 12;
  bool consumers_supported = 13;
  // 当前实际安装目录的身份；配置版本不变的热换也必须撤销旧完整目录。
  optional bytes certificates_digest = 14;
  bool material_previews_supported = 15;
  bool material_previews_enabled = 16;
  // 候选预检独立协商；只有公开条件查询能力的节点不能接收秘密材料。
  bool material_candidates_supported = 17;
  bool material_candidates_enabled = 18;
}

// 当前本地文件决定与业务就绪分开；没有历史、路径或恢复命令令牌。
enum PublicationState {
  PUBLICATION_STATE_UNSPECIFIED = 0;
  PUBLICATION_STATE_UNSUPPORTED = 1;
  PUBLICATION_STATE_DISABLED = 2;
  PUBLICATION_STATE_UNINITIALIZED = 3;
  PUBLICATION_STATE_UNAVAILABLE = 4;
  PUBLICATION_STATE_PROTECTED = 5;
  PUBLICATION_STATE_IDLE = 6;
  PUBLICATION_STATE_PREPARING = 7;
  PUBLICATION_STATE_FORWARD = 8;
  PUBLICATION_STATE_BACKWARD = 9;
}

message PublicationStorage {
  string cluster_id = 1;
  string store_id = 2;
  uint64 node_admission_epoch = 3;
  uint64 revision = 4;
  optional string operation_id = 5;
}

message PublicationObservation {
  uint32 schema = 1;
  PublicationState state = 2;
  PublicationStorage storage = 3;
}

// 与同一报告的节点、启动身份和配置绑定；原文摘要不代替完整依赖及当前授权。
message NodeBaseline {
  uint32 schema = 1;
  string cluster_id = 2;
  string store_id = 3;
  uint64 node_admission_epoch = 4;
  bytes documents_sha256 = 5;
}

message ReportResponse {
  uint64 accepted_sequence = 1;
  uint32 metrics_interest_ms = 2;
  ActionOffer action = 3;
  ReleaseOffer release = 4;
  bool service_metrics_supported = 5;
  PreviewOffer preview = 6;
  bool consumers_supported = 7;
  bool certificates_supported = 8;
  MaterialConditionsOffer material_conditions = 9;
  MaterialPreviewOffer material_preview = 10;
}

// 原目标字段复用结构，内层 signature 必须为空；只有外层独立签名可以授权候选下载。
message MaterialPreviewOffer {
  uint32 schema = 1;
  MaterialConditionsOffer original = 2;
  string proposal_id = 3;
  string store_id = 4;
  int64 admission_epoch = 5;
  string creator = 6;
  bytes proposal_authority_sha256 = 7;
  bytes proposal_intent_sha256 = 8;
  repeated MaterialPreviewPair pairs = 9;
  uint32 candidate_bytes = 10;
  bytes candidate_sha256 = 11;
  string signature = 12;
}

message MaterialPreviewPair {
  string certificate_etag = 1;
  string material_generation = 2;
}

message MaterialPreviewDataRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  string offer_id = 4;
  uint32 offset = 5;
}

message MaterialPreviewDataResponse {
  string offer_id = 1;
  uint32 offset = 2;
  bytes body = 3;
  bool eof = 4;
}

enum MaterialPreviewStatus {
  MATERIAL_PREVIEW_STATUS_UNSPECIFIED = 0;
  MATERIAL_PREVIEW_STATUS_SUCCEEDED = 1;
  MATERIAL_PREVIEW_STATUS_UNSUPPORTED = 2;
  MATERIAL_PREVIEW_STATUS_DISABLED = 3;
  MATERIAL_PREVIEW_STATUS_UNAVAILABLE = 4;
  MATERIAL_PREVIEW_STATUS_CAPACITY = 5;
  MATERIAL_PREVIEW_STATUS_EXPIRED = 6;
  MATERIAL_PREVIEW_STATUS_DENIED = 7;
  MATERIAL_PREVIEW_STATUS_BASELINE_CHANGED = 8;
  MATERIAL_PREVIEW_STATUS_TARGET_ABSENT = 9;
  MATERIAL_PREVIEW_STATUS_EXTERNAL_SOURCE = 10;
  MATERIAL_PREVIEW_STATUS_STORAGE = 11;
  MATERIAL_PREVIEW_STATUS_IMPACT_UNPROVEN = 12;
  MATERIAL_PREVIEW_STATUS_MATERIAL_CHANGED = 13;
  MATERIAL_PREVIEW_STATUS_CANDIDATE_INVALID = 14;
}

message MaterialPreviewResultRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  string offer_id = 4;
  MaterialPreviewStatus status = 5;
  MaterialConditionsBatch batch = 6;
  bytes impact_sha256 = 7;
}

message MaterialPreviewResultResponse {
  string accepted_offer_id = 1;
}

// 材料条件独立于配置候选和持久动作；原节点一次处理整批逻辑目标。
message MaterialTarget {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PROXY = 1;
    KIND_STREAM = 2;
  }
  Kind kind = 1;
  string listener = 2;
  string entry = 3;
}

message MaterialConditionsTarget {
  uint32 index = 1;
  MaterialTarget target = 2;
}

message MaterialConditionsOffer {
  uint32 schema = 1;
  string query_id = 2;
  uint32 target_count = 3;
  repeated MaterialConditionsTarget targets = 4;
  string node_id = 5;
  string boot_id = 6;
  NodeBaseline baseline = 7;
  uint64 base_version = 8;
  uint64 base_fingerprint = 9;
  string scope = 10;
  string principal = 11;
  bytes authority_sha256 = 12;
  string issuer_node_id = 13;
  bytes session = 14;
  uint64 issued_at_ms = 15;
  uint64 expires_at_ms = 16;
  string signature = 17;
}

enum MaterialConditionsStatus {
  MATERIAL_CONDITIONS_STATUS_UNSPECIFIED = 0;
  MATERIAL_CONDITIONS_STATUS_SUCCEEDED = 1;
  MATERIAL_CONDITIONS_STATUS_UNSUPPORTED = 2;
  MATERIAL_CONDITIONS_STATUS_DISABLED = 3;
  MATERIAL_CONDITIONS_STATUS_UNAVAILABLE = 4;
  MATERIAL_CONDITIONS_STATUS_CAPACITY = 5;
  MATERIAL_CONDITIONS_STATUS_EXPIRED = 6;
  MATERIAL_CONDITIONS_STATUS_DENIED = 7;
  MATERIAL_CONDITIONS_STATUS_BASELINE_CHANGED = 8;
  MATERIAL_CONDITIONS_STATUS_TARGET_ABSENT = 9;
  MATERIAL_CONDITIONS_STATUS_EXTERNAL_SOURCE = 10;
  MATERIAL_CONDITIONS_STATUS_STORAGE = 11;
  MATERIAL_CONDITIONS_STATUS_IMPACT_UNPROVEN = 12;
}

enum MaterialSource {
  MATERIAL_SOURCE_UNSPECIFIED = 0;
  MATERIAL_SOURCE_FILE = 1;
  MATERIAL_SOURCE_MANIFEST = 2;
  MATERIAL_SOURCE_ACME = 3;
}

message MaterialConditionsReference {
  uint32 index = 1;
  uint32 group = 2;
  MaterialSource source = 3;
}

message MaterialAffected {
  MaterialTarget target = 1;
  string source_id = 2;
}

message MaterialConditionsGroup {
  string certificate_etag = 1;
  optional string material_generation = 2;
  string source_id = 3;
  repeated MaterialAffected affected = 4;
}

// 相同写入来源只出现一次；影响必须完整，超量时整节点返回容量不足。
message MaterialConditionsBatch {
  repeated MaterialConditionsReference entries = 1;
  repeated MaterialConditionsGroup groups = 2;
}

message MaterialConditionsResultRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  string offer_id = 4;
  MaterialConditionsStatus status = 5;
  MaterialConditionsBatch batch = 6;
}

message MaterialConditionsResultResponse {
  string accepted_offer_id = 1;
}

// 独立只读证明不包含 Saga 步骤、文件方向或租约，原目标与候选不能由接收者替换。
message PreviewOffer {
  uint32 schema = 1;
  string proposal = 2;
  uint64 epoch = 3;
  uint32 target_index = 4;
  uint32 target_count = 5;
  ActionDomain domain = 6;
  string node_id = 7;
  string boot_id = 8;
  NodeBaseline baseline = 9;
  uint64 base_version = 10;
  uint64 base_fingerprint = 11;
  uint32 candidate_bytes = 12;
  bytes candidate_sha256 = 13;
  string scope = 14;
  string creator = 15;
  string principal = 16;
  bytes authority_sha256 = 17;
  string issuer_node_id = 18;
  bytes session = 19;
  uint64 issued_at_ms = 20;
  uint64 expires_at_ms = 21;
  string signature = 22;
}

message PreviewDataRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  string offer_id = 4;
  uint32 offset = 5;
}

message PreviewDataResponse {
  string offer_id = 1;
  uint32 offset = 2;
  bytes body = 3;
  bool eof = 4;
}

// 完整小结果只有对象身份；容量不足不能用截断列表或空差异表示成功。
message PreviewChanges {
  repeated string added = 1;
  repeated string removed = 2;
  repeated string changed = 3;
}

message PreviewSummary {
  uint64 current_version = 1;
  uint64 candidate_version = 2;
  PreviewChanges routes = 3;
  PreviewChanges upstreams = 4;
  PreviewChanges listeners = 5;
  PreviewChanges sentinel = 6;
  PreviewChanges interface_guard = 7;
}

enum PreviewStatus {
  PREVIEW_STATUS_UNSPECIFIED = 0;
  PREVIEW_STATUS_SUCCEEDED = 1;
  PREVIEW_STATUS_UNSUPPORTED = 2;
  PREVIEW_STATUS_DISABLED = 3;
  PREVIEW_STATUS_UNAVAILABLE = 4;
  PREVIEW_STATUS_CAPACITY = 5;
  PREVIEW_STATUS_EXPIRED = 6;
  PREVIEW_STATUS_DENIED = 7;
  PREVIEW_STATUS_BASELINE_CHANGED = 8;
  PREVIEW_STATUS_CANDIDATE_INVALID = 9;
}

message PreviewResultRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  string offer_id = 4;
  PreviewStatus status = 5;
  PreviewSummary summary = 6;
}

message PreviewResultResponse {
  string accepted_offer_id = 1;
}

// 命令没有 JSON 或候选正文，固定身份必须由双方重新派生并验证独立签名。
enum ActionDomain {
  ACTION_DOMAIN_UNSPECIFIED = 0;
  ACTION_DOMAIN_GATEWAY = 1;
  ACTION_DOMAIN_SENTINEL = 2;
  ACTION_DOMAIN_INTERFACE_GUARD = 3;
}

enum ActionPhase {
  ACTION_PHASE_UNSPECIFIED = 0;
  ACTION_PHASE_EXECUTE = 1;
  ACTION_PHASE_RESOLVE = 2;
  ACTION_PHASE_COMPENSATE = 3;
}

message ActionIdentity {
  string saga_id = 1;
  string tenant_id = 2;
  string workflow = 3;
  uint32 definition_version = 4;
  string definition_digest = 5;
  string step = 6;
  ActionPhase phase = 7;
  uint32 attempt = 8;
  string effect_id = 9;
  string command_id = 10;
  optional string recovery_operation_id = 11;
}

message ActionIntent {
  string operation_id = 1;
  uint64 proposal_epoch = 2;
  uint32 target_index = 3;
  uint32 target_count = 4;
  ActionDomain domain = 5;
  string node_id = 6;
  string original_boot_id = 7;
  NodeBaseline baseline = 8;
  uint64 base_version = 9;
  uint64 base_fingerprint = 10;
  uint32 candidate_bytes = 11;
  bytes candidate_sha256 = 12;
  string scope = 13;
  string creator = 14;
  string reviewer = 15;
  bytes authority_sha256 = 16;
}

// 当前 session 和接收 boot 只约束此次交付，不改变稳定业务意图。
message ActionDelivery {
  string issuer_node_id = 1;
  string receiving_boot_id = 2;
  uint64 fence = 3;
  bytes session = 4;
  uint64 issued_at_ms = 5;
  uint64 expires_at_ms = 6;
  // 只在 Resolve 中查询补偿效果，必须与该次投递签名一起验证。
  bool resolve_compensation = 7;
}

message ActionOffer {
  uint32 schema = 1;
  ActionIdentity identity = 2;
  ActionIntent intent = 3;
  ActionDelivery delivery = 4;
  string signature = 5;
}

// offer_id 是完整动作签名域的摘要，旧会话的正文不能用于另一投递。
message ActionDataRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  string offer_id = 4;
  uint32 offset = 5;
}

message ActionDataResponse {
  string offer_id = 1;
  uint32 offset = 2;
  bytes body = 3;
  bool eof = 4;
}

// Pending 与 Gone 不构成稳定效果，不能据此推进工作流或释放节点材料。
enum ActionOutcome {
  ACTION_OUTCOME_UNSPECIFIED = 0;
  ACTION_OUTCOME_SUCCEEDED = 1;
  ACTION_OUTCOME_REJECTED = 2;
  ACTION_OUTCOME_HALTED = 3;
  ACTION_OUTCOME_PENDING = 4;
  ACTION_OUTCOME_GONE = 5;
}

enum ActionReason {
  ACTION_REASON_UNSPECIFIED = 0;
  ACTION_REASON_CANDIDATE_INVALID = 1;
  ACTION_REASON_BASELINE_CHANGED = 2;
  ACTION_REASON_PUBLICATION_CONFLICT = 3;
  ACTION_REASON_AUTHORITY_CHANGED = 4;
  ACTION_REASON_GATE_HALTED = 5;
  ACTION_REASON_PREPARATION_INTERRUPTED = 6;
  ACTION_REASON_EFFECT_NOT_ADMITTED = 7;
}

// 完整业务身份从发行端保留的 offer 派生，节点不能替换结果所属命令。
message ActionResultRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  string offer_id = 4;
  ActionOutcome outcome = 5;
  ActionReason reason = 6;
}

message ActionResultResponse {
  string accepted_offer_id = 1;
}

// 终态释放独立于工作流效果，只关闭原代际，不宣称配置仍然活动。
enum ReleaseTerminal {
  RELEASE_TERMINAL_UNSPECIFIED = 0;
  RELEASE_TERMINAL_COMPLETED = 1;
  RELEASE_TERMINAL_COMPENSATED = 2;
}

message ReleaseOffer {
  uint32 schema = 1;
  ActionIntent intent = 2;
  string definition_digest = 3;
  ReleaseTerminal terminal = 4;
  ActionDelivery delivery = 5;
  string signature = 6;
}

// 关闭事实必须精确匹配原释放；缺失字段或 closed=false 不构成确认。
message ReleaseResultRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  string release_id = 4;
  bytes intent_sha256 = 5;
  string store_id = 6;
  uint64 node_admission_epoch = 7;
  bool closed = 8;
}

message ReleaseResultResponse {
  string accepted_release_id = 1;
}

// 每次流只携带当前累计样本；完整摘要与EOF通过后才对观察者可见。
message MetricLabel {
  string key = 1;
  string value = 2;
}

message MetricReading {
  string name = 1;
  repeated MetricLabel labels = 2;
  oneof value {
    uint64 counter = 3;
    double gauge = 4;
  }
}

message MetricCapability {
  string name = 1;
  bool enabled = 2;
}

message SampleHeader {
  NodeFacts facts = 1;
  uint64 sampled_at_ms = 2;
  uint64 elapsed_ms = 3;
  uint64 sampling_period_ms = 4;
  uint64 age_ms = 5;
  uint32 total = 6;
  repeated uint64 bounds_ms = 7;
  repeated uint64 buckets = 8;
  uint64 sum_micros = 9;
  repeated MetricCapability capabilities = 10;
  optional bool route_capacity = 11;
  uint32 route_total = 12;
  optional bool service_capacity = 13;
  uint32 service_total = 14;
}

// 服务状态独立于入口流量，未知发现不携带旧实例计数。
message ServiceState {
  string service = 1;
  string workspace = 2;
  string source = 3;
  bool critical = 4;
  bool active_probes = 5;
  enum Availability {
    UNSPECIFIED = 0;
    AVAILABLE = 1;
    MISSING = 2;
    STALE = 3;
  }
  Availability availability = 6;
  ServiceCounts counts = 7;
}

message ServiceCounts {
  uint32 instances = 1;
  uint32 configured_selectable = 2;
  uint32 manually_down = 3;
  uint32 backup = 4;
  uint32 active_rejected = 5;
}

// 入口事实随配置所有者变化；固定数组顺序由协议约定，不能携带任意客户维度。
message RouteTraffic {
  string proxy = 1;
  string route = 2;
  string workspace = 3;
  uint64 requests = 4;
  uint64 active = 5;
  repeated uint64 responses = 6;
  uint64 bytes = 7;
  repeated uint64 outcomes = 8;
  uint64 duration_micros = 9;
  repeated uint64 buckets = 10;
}

message SampleRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  uint64 sample_id = 4;
  bytes digest = 5;
  uint32 offset = 6;
  SampleHeader header = 7;
  repeated MetricReading readings = 8;
  repeated RouteTraffic routes = 9;
  repeated ServiceState services = 10;
}

message SampleResponse {
  uint64 accepted_sample_id = 1;
}

// 只传公开目录字段；完整分片集合验证后才替换当前目录。
message CatalogEntry {
  string kind = 1;
  string id = 2;
  string parent = 3;
  string workspace = 4;
  string tenant = 5;
  string environment = 6;
  string service = 7;
  sint32 order = 8;
  uint64 flags = 9;
}

// 工作区读取证明与同代对象目录一起发布，不能把旧权限用于新对象。
message ScopeAuthority {
  string workspace = 1;
  bytes digest = 2;
}

message CatalogRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  uint64 config_version = 4;
  optional uint64 config_fingerprint = 5;
  bytes digest = 6;
  uint32 total = 7;
  uint32 offset = 8;
  bool capacity = 9;
  repeated CatalogEntry entries = 10;
  bool scope_supported = 11;
  bytes scope_digest = 12;
  repeated ScopeAuthority scopes = 13;
}

message CatalogResponse {
  uint32 next_offset = 1;
  bool complete = 2;
}

// 本代编译后凭据序号仅用于读取，不是原文 filters 下标或配置修改令牌。
message ConsumerEntry {
  string consumer = 1;
  string proxy = 2;
  string route = 3;
  uint32 ordinal = 4;
  string source = 5;
  string name = 6;
  bool enabled = 7;
  string plan = 8;
  string workspace = 9;
  string tenant = 10;
  string environment = 11;
}

message ConsumersRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  uint64 config_version = 4;
  optional uint64 config_fingerprint = 5;
  bytes digest = 6;
  uint32 total = 7;
  uint32 offset = 8;
  bool capacity = 9;
  repeated ConsumerEntry entries = 10;
}

// 公开叶证书事实，不传送 DER、PEM、私钥或文件路径。
message CertificateLeaf {
  bytes sha256 = 1;
  int64 not_before = 2;
  int64 not_after = 3;
  repeated string names = 4;
}

message CertificateEntry {
  string listener = 1;
  string protocol = 2;
  string binding = 3;
  uint32 selection_order = 4;
  string state = 5;
  string source = 6;
  CertificateLeaf leaf = 7;
  optional int64 ocsp_valid_until = 8;
  bool ocsp_required = 9;
  string workspace = 10;
  string tenant = 11;
  string environment = 12;
}

message CertificatesRequest {
  string node_id = 1;
  string boot_id = 2;
  bytes session = 3;
  uint64 config_version = 4;
  optional uint64 config_fingerprint = 5;
  bytes digest = 6;
  uint32 total = 7;
  uint32 offset = 8;
  bool capacity = 9;
  repeated CertificateEntry entries = 10;
}
