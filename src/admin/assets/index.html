<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Naway 管理台</title>
    <link rel="stylesheet" href="/ui/shell.css" />
    <script type="module" src="/ui/core/app.js"></script>
  </head>
  <body>
    <a href="#view" class="skip-link">跳转到页面内容</a>
    <header class="topbar">
      <a class="brand" href="/monitor"
        >N<span>AWAY</span><small>网关管理</small></a
      >
      <div class="identity">
        <span id="principal">未登录</span
        ><button id="signout" type="button" hidden>退出</button>
      </div>
    </header>
    <div class="layout">
      <aside id="navigation" aria-label="管理导航" inert>
        <details class="nav-group" data-nav-group="monitoring" open>
          <summary>集群监控</summary>
          <div class="nav-items">
            <button id="nodes-nav" type="button" data-view="nodes">
              集群节点
            </button>
            <button id="monitor-nav" type="button" data-view="monitor">
              实时监控 <span>LIVE</span>
            </button>
            <button id="services-nav" type="button" data-view="services">
              服务实时状态
            </button>
            <button id="traffic-nav" type="button" data-view="traffic">
              路由实时流量
            </button>
            <button id="streams-nav" type="button" data-view="streams">
              监听器实时流量
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="system">
          <summary>系统配置</summary>
          <div class="nav-items">
            <button
              id="configuration-nav"
              type="button"
              data-view="configuration"
            >
              系统 YAML与Nacos发布
            </button>
            <button type="button" data-view="bootstrap-configuration">
              启动依赖与配置中心
            </button>
            <button type="button" data-view="observability-configuration">
              日志与遥测配置
            </button>
            <button id="providers-nav" type="button" data-view="providers">
              配置来源
            </button>
            <button type="button" data-view="system">管理会话与权限</button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="sentinel">
          <summary>Sentinel</summary>
          <div class="nav-items">
            <button id="sentinel-nav" type="button" data-view="sentinel">
              流控、熔断与降级 YAML
            </button>
            <button type="button" data-view="sentinel-proposals">
              规则变更提案
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="proxy">
          <summary>代理配置</summary>
          <div class="nav-items">
            <button id="catalog-nav" type="button" data-view="catalog">
              路由与入口
            </button>
            <button
              id="proxy-configuration-nav"
              type="button"
              data-view="proxy-configuration"
            >
              路由、上游与监听 YAML
            </button>
            <button type="button" data-view="proxy-proposals">
              代理变更提案
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="security">
          <summary>安全与认证</summary>
          <div class="nav-items">
            <button type="button" data-view="interface-guard-configuration">
              HTTP接口守卫 YAML
            </button>
            <button type="button" data-view="security-configuration">
              安全与认证 YAML
            </button>
            <button id="ingress-nav" type="button" data-view="ingress">
              HTTP入口防护
            </button>
            <button id="consumers-nav" type="button" data-view="consumers">
              集群消费者
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="certificates">
          <summary>证书与密钥</summary>
          <div class="nav-items">
            <button type="button" data-view="certificate-configuration">
              证书与密钥来源 YAML
            </button>
            <button
              id="certificates-nav"
              type="button"
              data-view="certificates"
            >
              集群活动证书
            </button>
            <button id="materials-nav" type="button" data-view="materials">
              证书材料
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="workspaces">
          <summary>工作区与租户</summary>
          <div class="nav-items">
            <button type="button" data-view="workspace-configuration">
              工作区、归属与预算 YAML
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="portal">
          <summary>API产品与门户</summary>
          <div class="nav-items">
            <button type="button" data-view="portal-configuration">
              产品、团队与应用 YAML
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="ai">
          <summary>AI与Agent</summary>
          <div class="nav-items">
            <button type="button" data-view="ai-configuration">
              模型、路由与工具 YAML
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="changes">
          <summary>变更与发布</summary>
          <div class="nav-items">
            <button type="button" data-view="approvals">配置审批队列</button>
            <button id="operations-nav" type="button" data-view="operations">
              变更提案
            </button>
            <button
              id="runtime-actions-nav"
              type="button"
              data-view="runtime-actions"
            >
              运行态治理
            </button>
          </div>
        </details>
        <details class="nav-group" data-nav-group="diagnostics">
          <summary>诊断与审计</summary>
          <div class="nav-items">
            <button id="diagnostics-nav" type="button" data-view="diagnostics">
              限时诊断
            </button>
          </div>
        </details>
        <p class="nav-foot">当前快照 · 有界采样<br />不保存监控历史</p>
      </aside>
      <main>
        <div class="page-heading">
          <div>
            <p class="eyebrow">NAWAY / CONTROL PLANE</p>
            <h1 id="title">Naway 管理台</h1>
            <p id="subtitle">连接管理面，查看当前运行状态</p>
          </div>
        </div>
        <p id="notice" role="status" aria-live="polite"></p>
        <form id="login" class="login panel">
          <h2>连接管理面</h2>
          <p class="subtle">凭据仅保存在当前页面内存。关闭页面或退出后清除。</p>
          <label
            >认证方式<select id="auth-mode">
              <option value="bearer">Bearer Token</option>
              <option value="basic">Basic</option>
            </select></label
          >
          <div id="bearer-fields">
            <label
              >Token<input
                id="token"
                type="password"
                autocomplete="off"
                maxlength="8192"
                placeholder="未启用认证的本机可留空"
            /></label>
          </div>
          <div id="basic-fields" hidden>
            <label
              >用户名<input
                id="user"
                autocomplete="off"
                maxlength="1024" /></label
            ><label
              >密码<input
                id="password"
                type="password"
                autocomplete="off"
                maxlength="8192"
            /></label>
          </div>
          <button class="primary" type="submit">连接</button>
        </form>
        <section id="workspace" hidden>
          <div id="view" tabindex="-1"></div>
        </section>
      </main>
    </div>
  </body>
</html>
