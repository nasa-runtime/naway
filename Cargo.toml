[package]
name = "naway"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["Naway contributors"]
license = "Apache-2.0 OR MIT"
description = "高性能、资源有界的 Rust 流量与业务网关，支持原生 gRPC 边缘散出与多种集群传输。"
repository = "https://github.com/nasa-runtime/naway"
homepage = "https://github.com/nasa-runtime/naway"
documentation = "https://github.com/nasa-runtime/naway/tree/main/docs"
readme = "README.md"
keywords = ["gateway", "grpc", "reverse-proxy", "redis", "service-mesh"]
categories = ["network-programming", "web-programming::http-server"]

[[bin]]
name = "local_a2_benchmark"
path = "tests/support/local_a2_benchmark.rs"

[[bin]]
name = "local_edge_benchmark"
path = "tests/support/local_edge_benchmark.rs"

[[bin]]
name = "local_h3_benchmark"
path = "tests/support/local_h3_benchmark.rs"
required-features = ["http3"]

[features]
default = []
# Compile the real nacos-sdk transport through the nasa facade. Without this
# feature the Nacos API is present, but enabling discovery at runtime fails fast.
nacos-sdk = ["nasa/nacos-sdk"]
# Enable Redis-backed runtime state primitives used by V3 Sentinel shared limiters.
redis-runtime = ["nasa/redis"]
# Enable the optional V5 native Kafka access-log sink through the nasa facade.
# HTTP/Elasticsearch/Loki sinks do not require this feature.
log-kafka = ["nasa/kafka"]
# V8 gRPC edge mode gate。覆盖统一契约、Subscribe/Publish/Push、静态或 Nacos relay、
# mTLS、SessionDirectory、interest auto 与 Redis 两类入口；未编此 feature 时，配置 edge
# route/relay 会在快照构建期 fail-fast，普通 L7 路径不受影响。
grpc-edge = []
# V9 HTTP/3/QUIC 独立制品门；关闭时不编译 QUIC/H3 transport，也不在 TCP/H2 热路径
# 创建 UDP task。配置启用但制品未带本 feature 时必须在快照构建期 fail-fast。
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn"]
# V10 xDS v3 client 独立制品门；Envoy protobuf、ADS gRPC transport 与状态机只在该
# feature 中编译。默认 core 仍只解析并拒绝越权 xDS 配置，不携带 tonic/prost 代码。
xds-client = ["dep:prost", "dep:prost-types", "dep:tonic", "dep:tonic-prost", "dep:tokio-stream"]
# Descriptor 解析与动态 protobuf JSON 只进入显式制品；普通 native gRPC 转发不携带反射运行时。
grpc-descriptor = ["dep:prost", "dep:prost-types", "dep:prost-reflect"]
# 启用 Dubbo2 Hessian2 泛化调用 codec；关闭时不编译 Hessian2 数据面，相关配置在快照构建期拒绝。
dubbo-hessian2 = []
# MQTT 协议治理独立制品门；关闭时 stream 继续透明转发，不编译 packet/QoS 状态机。
mqtt-governance = []
# Kafka 协议治理独立制品门；关闭时 stream 继续透明转发，不编译 frame/ACL/rewrite 状态机。
kafka-governance = []
# 内嵌 Rego 解释器只进入显式制品；外部 OPA Data API 与默认代理路径不携带解释器。
opa-embedded = ["dep:regorus"]
# 企业身份能力按协议拆分，默认制品不携带 JOSE 解密、XML Signature 或 LDAP client。
enterprise-jwe = ["dep:josekit"]
enterprise-saml = ["dep:saml-rs"]
enterprise-ldap = ["dep:ldap3"]
enterprise-identity = ["enterprise-jwe", "enterprise-saml", "enterprise-ldap"]

[dependencies]
# —— 数据面(hyper 反向代理)——
anyhow = "1"
arc-swap = "1"                        # 单快照原子换版(无感热更)
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2"] } # V5 admin server；路由声明/类型优先走 nasa::web 门面
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli"] } # V5 gzip/br 流式编解码；不聚合响应 body
base64 = "0.22"                       # gRPC-Web text 与 Connect status details 的标准 Base64 envelope
bytes = "1"
casbin = { version = "2.20.0", default-features = false, features = ["glob", "ip", "runtime-tokio"] } # V7 内嵌 RBAC/ABAC；模型/策略构建后只读
crossbeam-utils = "0.8"                # 热指标 CachePadded 条带计数，避免 Tokio worker 争用同一 cache line
clap = { version = "4", features = ["derive"] }
dashmap = "6"                         # 长流连接表分片并发；避免 gRPC 短流注册/注销争用单全局锁
ed25519-dalek = "2.2"                 # OPA bundle detached Ed25519 签名；激活前验证原始压缩字节
flate2 = "1"                          # 解包标准 OPA tar.gz bundle；解压过程受独立字节硬门
globset = "0.4"                       # 接口守卫 path glob
getrandom = "0.2"                     # WS client→upstream Close 帧按 RFC 6455 生成不可预测 mask
http = "1"
http-body-util = { version = "0.1", features = ["channel"] }
httpdate = "1"                           # cache 条件请求解析 RFC HTTP-date，不自造不完整日期语法
hmac = "0.12"                           # RFC2136 DNS-01 的 HMAC-SHA256 TSIG 签名与响应认证
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "native-tokio", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "tokio", "http1", "http2"] }
h3 = { version = "0.0.8", optional = true, features = ["tracing"] } # V9 HTTP/3 frame/QPACK 状态机；只由 http3 feature 引入
h3-quinn = { version = "0.0.10", optional = true, features = ["tracing"] } # V9 把 Quinn stream 适配到 h3 traits
mimalloc = { version = "0.1.52", default-features = false }
instant-acme = { version = "0.8.5", features = ["rcgen"] } # RFC 8555 HTTP-01/DNS-01 签发与续期
jsonschema = { version = "0.48.1", default-features = false } # V5 build-time JSON Schema validator；关闭网络/文件 resolver，拒绝外部 $ref
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto", "use_pem"] } # RS256/ES256、PEM/JWKS 严格验签；远端 URL 只取 route 固定配置
josekit = { version = "0.10.3", optional = true } # JWE compact RSA-OAEP-256 + A256GCM；只用于嵌套签名 JWT 解密
ldap3 = { version = "0.12.1", optional = true, default-features = false, features = ["tls-rustls-aws-lc-rs"] } # LDAPv3/LDAPS/StartTLS 企业目录认证
libc = "0.2"                          # `-s reload` 向运行进程发 SIGHUP
notify = "6"                          # 本地配置文件监听热更
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] } # V5 W3C context + server/client span API
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] } # V5 head sampling + bounded batch processor
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] } # V5 OTLP/HTTP protobuf exporter
parking_lot = "0.12"                  # 上游 client cache 共享读快路径；短临界区不占 Tokio 异步锁
percent-encoding = "2"                # OpenAPI path parameter percent-decode；不同于 query，不把 `+` 错当空格
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2", "form", "json", "query"] } # 后台 HTTP、受控 callout 与有界表单/响应读取
quinn = { version = "0.11.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] } # V9 QUIC/TLS 1.3 transport；与现有 aws-lc rustls provider 对齐
prost = { version = "0.14.4", optional = true } # V10 只编码显式声明的 xDS v3 message surface
prost-types = { version = "0.14.4", optional = true } # V10 DiscoveryResponse Any 与基础 wrapper
prost-reflect = { version = "0.16.5", optional = true, features = ["serde"] } # descriptor 编译与标准 protobuf JSON
rustls-pemfile = "2"                  # TLS cert/key PEM 解析
rustls-native-certs = "0.8"           # BackendTLSPolicy System CA 与显式 SAN 校验共用本机信任根
rustls-webpki = "0.103"               # BackendTLSPolicy 显式 SAN 时独立执行证书链与用途校验
saml-rs = { version = "0.3.0", optional = true } # 纯 Rust SAML SP、严格 XML Signature/反 wrapping 校验
serde = { version = "1", features = ["derive"] }
serde_json = "1"                      # 配置 tree(nasa::yml 产出 serde_json::Value)
serde_yml = "0.0.12"                  # Console 语义编辑与三文档 dry-run 工作区
sha2 = "0.10"                         # V5 cache key 增量摘要；避免把 Vary/header 原值写进 L1/Redis key
tar = "0.4"                           # 标准 OPA bundle archive；拒绝链接与路径穿越 entry
socket2 = { version = "0.6", features = ["all"] } # V7 SO_REUSEPORT 两阶段 listener 热切换
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
time = { version = "0.3.53", features = ["formatting"] }
tokio-stream = { version = "0.1.18", optional = true } # V10 有界 ADS request channel → tonic stream
tokio-rustls = "0.26"                 # TLS 监听 + ALPN
tonic = { version = "0.14.6", optional = true, default-features = false, features = ["channel", "codegen", "tls-aws-lc"] } # V10 ADS bidi gRPC client；不编 router/server
tonic-prost = { version = "0.14.6", optional = true } # V10 手写选择性 proto 的 Prost codec
tower-service = "0.3"
tracing = "0.1"                       # 日志宏(info!/warn!/...);全局订阅初始化用 nasa::log
tracing-opentelemetry = { version = "0.33", default-features = false } # V5 tracing/OTel 同栈桥接；与 opentelemetry 0.32 配套
form_urlencoded = "1"                 # V5 schema 慢路径 query percent-decoding；Cow 复用无转义片段
regex = "1"                           # Gateway API HTTPRoute header/query RegularExpression 构建期编译
regorus = { version = "0.10.1", optional = true, default-features = false, features = ["full-opa", "arc"] } # 显式 embedded OPA profile 的 Rego 解释器
futures = "0.3"                       # 仅用于快照构建期驱动 Casbin 的字符串 adapter future
x509-parser = "0.18"                  # 控制面解析证书 notAfter，避免无条件重复下单
wasmtime = { version = "46.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] } # V7 Proxy-Wasm 沙箱；无 WASI/文件/网络权限

# —— 复用 nasa-runtime-rust 生态（yml 解析走 nasa::yml，日志走 nasa::log）——
# 当前 path 用于联调尚未发布的 Nacos 首次 bundle API，version 仍锁定兼容基线。
# 公开发布前必须先发布对应 nanacos/nasa 版本，再移除 path 并执行 cargo publish --dry-run；
# 不能让 crates.io 制品依赖本机目录。V4 数据面 HMAC/JWT 验签复用 nasa::crypto。
nasa = { version = "1.0.2", features = ["yml", "log", "base", "nacos", "crypto", "cache", "web"] }

# 联调期把 nasa 的 crates.io nanacos 解析统一到 sibling 源码；否则 Cargo 会同时存在两个同名
# package，Naway 编译到旧发布 API，而本地验证的 CAS/not-found 修复不会进入制品。
[patch.crates-io]
nanacos = { path = "../nasa-runtime-rust/nanacos" }
napp = { path = "../nasa-runtime-rust/napp" }
nabase = { path = "../nasa-runtime-rust/nabase" }
macro-support = { path = "../nasa-runtime-rust/macro-support" }

[dev-dependencies]
rcgen = "0.12"
tokio = { version = "1", features = ["full", "test-util"] } # start_paused 时钟仅测试形态启用
wat = "1"                            # V7 进程级 Proxy-Wasm 回归测试动态生成最小标准模块
